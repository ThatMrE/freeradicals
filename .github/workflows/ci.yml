name: CI

on:
  push:
    branches: [master]
  pull_request:

# Nothing here writes to the repository or talks to the API.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only devDependencies (Playwright) are installed; the extension itself
      # ships no dependencies and needs no build.
      - run: npm ci

      - name: Unit tests
        run: npm test

      # manifest.json and the two content-script tables are generated from
      # core/platforms.js. Regenerating them must be a no-op: if it is not,
      # the registry changed and the generated files were never rebuilt, so
      # the shipped manifest would be missing a network's hosts.
      - name: Generated files match the platform registry
        run: |
          node tools/build-manifest.mjs
          git diff --exit-code -- \
            manifest.json \
            extension/content/routes.generated.js \
            extension/content/signals.generated.js

  e2e:
    name: End-to-end (real Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The suite loads the unpacked extension, which needs the full Chromium
      # build rather than the headless shell — hence `channel: 'chromium'` in
      # the test and a plain `install chromium` here.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
